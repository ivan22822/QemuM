name: Ошибка в QemuM
description: Сообщить о проблеме при обычной работе
title: "[Ошибка] "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за помощь. В приложении открой «Помощь / отчёт».
        Отметь нужные данные, сохрани ZIP и проверь его перед прикреплением.
        Issues публичные; не прикладывай пароли, личные документы, диски или ISO.
  - type: input
    id: version
    attributes:
      label: Версия QemuM
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Что ты делал
      description: Несколько шагов, после которых появилась проблема.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Что ожидал и что произошло
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Отчёт или текст ошибки
      description: Перетащи сюда проверенный ZIP. Отчёт необязателен.
  - type: input
    id: system
    attributes:
      label: Windows и гостевая ОС
      placeholder: Windows 11, Ubuntu Desktop, профиль Auto
