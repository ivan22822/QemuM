name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and native GUI tests
        run: python tools/test.py --gui
      - name: Build isolated development app
        run: python tools/build.py
      - name: Audit tracked source files
        run: python tools/audit.py --staged
