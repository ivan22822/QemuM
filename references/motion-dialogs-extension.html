let members=[0,2],standName='Research laboratory';let rollback=null;let selected=2,screen='snapshots',configTab='Resources',networkTab='Adapters',wizardStep=0,wizard={name:'New machine',iso:'',ram:4096,cpu:2,disk:32};let toastTimer,operationTimer,operationStage=0,confirmAction=null;

else if(screen==='configuration'){chrome('04','Configuration',m,'VM / NEXT START');body='<div class="dw-settings"><nav class="dw-nav" aria-label="Configuration pages">'+['Resources','Storage','Display','Appearance'].map((t,i)=>B('config-tab:'+t,'<span>'+t+'</span><span class="dw-index">0'+(i+1)+'</span>',t===configTab?'active':'')).join('')+'</nav><section id="configContent"></section></div>';actions=B('close','Cancel')+'<button class="primary" type="submit" form="configStudy">Save changes</button>';}
else if(screen==='new-machine'){chrome('05','New machine','Create a local system','CREATION / '+(wizardStep+1)+' OF 3');body='<div class="dw-stepper">'+['Identity','Resources','Review'].map((t,i)=>'<div class="dw-step '+(wizardStep===i?'active':'')+'"><b>0'+(i+1)+'</b>'+t+'</div>').join('')+'</div><form id="wizardForm"></form>';actions=B(wizardStep?'wizard-back':'close',wizardStep?'Back':'Cancel')+'<button class="primary" type="submit" form="wizardForm">'+(wizardStep===2?'Create machine':('Continue '+I('arrow')))+'</button>';}
else if(screen==='stand'){chrome('06','Stand settings',standName,'STAND / MEMBERSHIP');body='<form id="standStudy">'+field('Stand name','name',standName,'text','required maxlength="120"')+'<section style="margin-top:24px"><h2>Members</h2>'+machineNames.map((name,i)=>'<div class="dw-choice"><span><strong>'+name+'</strong><small>'+([4,8,4,2][i])+' GB · '+([2,4,2,1][i])+' vCPU</small></span>'+B('toggle-member:'+i,members.includes(i)?'Included':'Include',members.includes(i)?'on':'','aria-pressed="'+members.includes(i)+'"')+'</div>').join('')+'</section><div class="dw-validation" id="standValidation"></div></form>';actions=B('close','Cancel')+'<button type="submit" form="standStudy" class="primary">Save stand</button>';}
else if(screen==='operation'){chrome('07','Operation',m,'PREVIEW / SIMULATED PROGRESS');body='<div class="dw-operation"><div class="dw-label">SNAPSHOT / CREATE</div><div class="dw-operation-word" id="operationWord">SAV<span>ING</span></div><div class="dw-progress" id="progress"><i></i></div><div class="dw-meta" id="progressText"></div></div><div class="dw-operation-steps" id="operationSteps"></div>';actions=B('cancel-operation','Cancel operation','danger')+B('close','Close','','disabled id="operationClose"');}
else if(screen==='service'){chrome('08','Service','Workspace tools','LOCAL CONTROL / UTILITIES');const tiles=[['settings','Application settings','Theme, density and motion','preferences'],['shield','Diagnostics','QEMU, runtime and capabilities','diagnostics'],['folder','Configuration copies','Saved machine parameters','copies'],['layers','Updates','Application version and channel','updates']];body='<div class="dw-service-grid">'+tiles.map(([i,title,text,act])=>B('service:'+act,I(i)+'<span><strong>'+title+'</strong><br><small>'+text+'</small></span>','dw-service')).join('')+'</div>';actions=B('close','Close');}
else{chrome('09','Delete machine',m,'DESTRUCTIVE ACTION / REVIEW');body='<div class="dw-card">'+row('Machine',m)+row('State','Stopped')+row('Disk',config.disk)+row('ISO',config.iso||'Not attached')+'</div><p class="dw-note">This preview removes the demo entry only. No disk files will be deleted.</p><form id="deleteStudy" style="margin-top:22px">'+field('Type DELETE to confirm','confirm','','text','required pattern="DELETE" autocomplete="off"')+'</form>';actions=B('close','Cancel')+'<button type="submit" form="deleteStudy" class="danger">Delete demo machine</button>';}
$('#windowBody').innerHTML=body;$('#windowActions').innerHTML=actions;
if(screen==='snapshots'){drawSnapshots();$('#snapshotQuery').addEventListener('input',drawSnapshots);$('#snapshotType').addEventListener('change',drawSnapshots);}if(screen==='network')drawNetwork();if(screen==='configuration')drawConfig();if(screen==='new-machine')drawWizard();}
function drawSnapshots(){const query=$('#snapshotQuery').value.toLowerCase(),type=$('#snapshotType').value;const rows=snaps.filter(s=>s.name.toLowerCase().includes(query)&&(type==='all'||s.type===type));if(!rows.some(s=>s.id===selected))selected=rows[0]?.id;$('#snapshotRows').innerHTML=rows.length?rows.map(s=>B('select-snapshot:'+s.id,I(s.type==='ram'?'monitor':'layers')+'<span><strong>'+E(s.name)+'</strong><small>'+s.date+'</small></span><span class="dw-tag">'+(s.protected?'LOCKED':s.type.toUpperCase())+'</span>','dw-snapshot','aria-selected="'+(selected===s.id)+'"')).join(''):'<div class="dw-empty">No matching snapshots.</div>';const s=snaps.find(s=>s.id===selected);$('#snapshotDetails').innerHTML=s?'<div class="dw-label">RESTORE POINT / '+String(s.id).padStart(2,'0')+'</div><div class="dw-detail-name">'+E(s.name)+'</div>'+row('Type',s.type==='ram'?'Full state / TCG':'Disk snapshot')+row('Created',s.date)+row('Size',s.size)+row('Protection',s.protected?'Protected':'Off')+'<p class="dw-note">'+E(s.note)+'</p>':'<div class="dw-empty">Select a restore point.</div>';$('#windowActions [data-dw=restore]').disabled=!s;$('#windowActions [data-dw=delete-snapshot]').disabled=!s||s.protected;}
function drawNetwork(){const target=$('#networkContent');if(networkTab==='Port forwarding'){target.innerHTML='<div class="dw-card">'+row('Protocol','TCP')+row('Host address','127.0.0.1')+row('Host port','2222')+row('Guest port','22')+'</div><div class="dw-inline" style="margin-top:16px">'+B('forwarding','Edit forwarding rule')+'</div>';return;}target.innerHTML=nics.length?nics.map((n,i)=>'<div class="dw-adapter"><span class="dw-adapter-icon">'+I('network')+'</span><span><strong>'+E(n.id)+' / '+E(n.mode)+'</strong><small>'+E(n.model)+' · '+E(n.mac)+'</small></span>'+B('edit-adapter:'+i,'Configure')+'</div>').join(''):'<div class="dw-empty">No adapters configured.</div>';}
function adapterEditor(index){const n=nics[index];confirmAction=null;$('#confirmTitle').textContent='Configure '+n.id;$('#confirmDescription').innerHTML='<form id="adapterStudy" data-index="'+index+'"><label class="dw-field"><span>Connection</span><select name="mode" style="width:100%;padding:10px;margin:8px 0 16px">'+['NAT','Isolated LAN','TAP','TCP socket','Multicast'].map(m=>'<option '+(m===n.mode?'selected':'')+'>'+m+'</option>').join('')+'</select></label><label class="dw-field"><span>Model</span><select name="model" style="width:100%;padding:10px;margin-top:8px">'+['e1000e','virtio-net-pci','rtl8139'].map(m=>'<option '+(m===n.model?'selected':'')+'>'+m+'</option>').join('')+'</select></label></form>';$('#confirmAccept').textContent='Apply';$('#confirmAccept').onclick=()=>{const f=$('#adapterStudy');n.mode=f.elements.mode.value;n.model=f.elements.model.value;$('#confirmStudy').close();drawNetwork();};$('#confirmStudy').showModal();}
function drawConfig(){let body='<form id="configStudy" class="dw-grid">';if(configTab==='Resources')body+=field('Machine name','name',config.name,'text','required maxlength="120"')+'<label class="dw-field"><span>Acceleration</span><select name="accel">'+['Auto','TCG','WHPX'].map(a=>'<option '+(config.accel===a?'selected':'')+'>'+a+'</option>').join('')+'</select></label>'+field('Memory, MB','memory',config.memory,'number','required min="128" max="262144"')+field('Virtual CPUs','cpu',config.cpu,'number','required min="1" max="64"');else if(configTab==='Storage')body+=field('Disk image','disk',config.disk)+field('ISO image','iso',config.iso)+'<div class="dw-card dw-field wide">'+row('Disk format','qcow2')+row('Virtual size','32 GB')+'</div>';else if(configTab==='Display')body+='<label class="dw-field"><span>Video adapter</span><select name="video"><option>virtio</option><option>std</option><option>qxl</option></select></label>'+field('Width','width','1920','number','min="640" max="7680"')+field('Height','height','1080','number','min="480" max="4320"');else body+='<div class="dw-field wide"><span>System icon</span><div class="dw-radio-group">'+['Auto','Ubuntu','Kali','Generic'].map((a,i)=>B('appearance:'+a,a,i===0?'on':'','aria-pressed="'+(i===0)+'"')).join('')+'</div></div><div class="dw-card dw-field wide" style="text-align:center;padding:35px">'+I('monitor')+'<span class="dw-meta"> SYSTEM EMBLEM</span></div>';$('#configContent').innerHTML=body+'</form>';}
function drawWizard(){const f=$('#wizardForm');if(wizardStep===0)f.innerHTML='<div class="dw-grid">'+field('Machine name','name',wizard.name,'text','required maxlength="120"')+field('ISO filename','iso',wizard.iso,'text','placeholder="Choose an image"')+'</div>';else if(wizardStep===1)f.innerHTML='<div class="dw-grid">'+field('Memory, MB','ram',wizard.ram,'number','required min="128" max="262144"')+field('Virtual CPUs','cpu',wizard.cpu,'number','required min="1" max="64"')+field('Disk size, GB','disk',wizard.disk,'number','required min="1" max="2048"')+'</div>';else f.innerHTML='<div class="dw-card">'+row('Name',wizard.name)+row('ISO',wizard.iso||'Not attached')+row('Memory',wizard.ram+' MB')+row('Processor',wizard.cpu+' vCPU')+row('Disk size',wizard.disk+' GB')+'</div>';}
function ask(title,description,action){$('#confirmTitle').textContent=title;$('#confirmDescription').textContent=description;$('#confirmAccept').textContent='Confirm';$('#confirmAccept').onclick=()=>{$('#confirmStudy').close();action();};$('#confirmStudy').showModal();}
function runOperation(){operationStage=0;const names=['Validate configuration','Reserve disk images','Write restore point','Verify result'];function update(){const done=operationStage>=4;$('#operationWord').innerHTML=done?'SAV<span>ED</span>':'SAV<span>ING</span>';$('#progress').style.setProperty('--progress',Math.min(100,operationStage*25)+'%');$('#progressText').textContent=done?'COMPLETE / DEMO RESULT':('STEP '+(operationStage+1)+' OF 4');$('#operationSteps').innerHTML=names.map((name,i)=>'<div class="'+(i===operationStage?'current':'')+'"><b>'+(i<operationStage?'✓':String(i+1).padStart(2,'0'))+'</b>'+name+'</div>').join('');$('#operationClose').disabled=!done;$('#windowActions [data-dw=cancel-operation]').disabled=done;if(done)clearInterval(operationTimer);}update();operationTimer=setInterval(()=>{if(!$('#windowStudy').open||screen!=='operation'){clearInterval(operationTimer);return;}operationStage++;update();},1000);}
document.addEventListener('click',event=>{const b=event.target.closest('[data-dw]');if(!b||b.disabled)return;const a=b.dataset.dw;if(a.startsWith('open:')){open(a.slice(5));return;}if(a.startsWith('select-snapshot:')){selected=Number(a.split(':')[1]);drawSnapshots();return;}if(a.startsWith('config-tab:')){const f=$('#configStudy');if(f){for(const key of ['name','memory','cpu','accel','disk','iso'])if(f.elements[key])config[key]=f.elements[key].value;}configTab=a.split(':')[1];render();return;}if(a.startsWith('network-tab:')){networkTab=a.split(':')[1];render();return;}if(a.startsWith('edit-adapter:')){adapterEditor(Number(a.split(':')[1]));return;}if(a.startsWith('toggle-member:')){const f=$('#standStudy');standName=f.elements.name.value;const id=Number(a.split(':')[1]);members=members.includes(id)?members.filter(x=>x!==id):[...members,id];render();return;}if(a.startsWith('appearance:')){b.parentElement.querySelectorAll('button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b);});return;}if(a.startsWith('service:')){const kind=a.split(':')[1];if(kind==='preferences'){chrome('08','Preferences','Application appearance','SERVICE / LOCAL PREVIEW');$('#windowBody').innerHTML='<div class="dw-grid"><label class="dw-field"><span>Theme</span><select><option>Words in motion / paper</option></select></label><label class="dw-field"><span>Density</span><select><option>Comfortable</option><option>Compact</option></select></label><div class="dw-field wide"><span>Motion</span>'+B('motion','Reduce motion','','aria-pressed="false"')+'</div></div>';$('#windowActions').innerHTML=B('open:service','Back')+B('save-preferences','Apply','primary');}else ask(kind==='updates'?'Up to date':kind==='diagnostics'?'Diagnostics preview':'Configuration copies',kind==='updates'?'This is a design preview. No update service is connected.':kind==='diagnostics'?'QEMU runtime and guest checks are simulated in this HTML study.':'No saved configuration copies in this preview.',()=>{});return;}
switch(a){case'close':$('#windowStudy').close();break;case'protect-new':{const active=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',active);b.classList.toggle('on',active);break;}case'restore':{const s=snaps.find(x=>x.id===selected);if(s)ask('Restore this point?','Restore “'+s.name+'” in the demo. Real recovery would require a verified plan and compatible machine state.',()=>toast('Restore selected · demonstration only'));break;}case'delete-snapshot':{const s=snaps.find(x=>x.id===selected);if(s&&!s.protected)ask('Delete snapshot?','Remove “'+s.name+'” from this browser-session catalog?',()=>{snaps=snaps.filter(x=>x.id!==s.id);drawSnapshots();});break;}case'add-adapter':{if(nics.length>=8){toast('Preview limit: eight adapters');break;}let i=0;while(nics.some(n=>n.id==='net'+i))i++;nics.push({id:'net'+i,mode:'NAT',model:'e1000e',mac:'52:54:00:12:34:'+String(i+1).padStart(2,'0')});drawNetwork();break;}case'save-network':rollback=null;toast('Network configuration saved in this preview');$('#windowStudy').close();break;case'forwarding':ask('Port forwarding','TCP · 127.0.0.1:2222 → guest:22. This is a static forwarding example; no port will be opened.',()=>toast('Forwarding example applied'));break;case'wizard-back':wizardStep=Math.max(0,wizardStep-1);render();break;case'cancel-operation':clearInterval(operationTimer);$('#operationWord').textContent='CANCELLED';$('#progressText').textContent='DEMO OPERATION CANCELLED';b.disabled=true;$('#operationClose').disabled=false;break;case'motion':{const active=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',active);b.classList.toggle('on',active);$('#windowStudy').style.animation=active?'none':'';break;}case'save-preferences':toast('Preview preferences applied');open('service');break;}});
$('#windowStudy').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;if(f.id==='snapshotForm'){snaps.push({id:Date.now(),name:f.elements.name.value.trim()||'Untitled snapshot',type:f.elements.type.value,date:new Date().toLocaleString('en-GB'),size:f.elements.type.value==='ram'?'4.2 GB':'2.1 GB',protected:$('#protectNew').getAttribute('aria-pressed')==='true',note:f.elements.note.value});selected=snaps.at(-1).id;open('snapshots');toast('Restore point added to the demo catalog');}else if(f.id==='configStudy'){for(const key of ['name','memory','cpu','accel','disk','iso'])if(f.elements[key])config[key]=f.elements[key].value;if(config.iso)config.iso=String(config.iso).split(/[\\/]/).pop();if(config.disk)config.disk=String(config.disk).split(/[\\/]/).pop();rollback=null;toast('Configuration saved in this preview');$('#windowStudy').close();}else if(f.id==='standStudy'){if(!members.length){$('#standValidation').textContent='Select at least one member.';return;}standName=f.elements.name.value.trim()||standName;rollback=null;toast('Stand membership saved in this preview');$('#windowStudy').close();}else if(f.id==='wizardForm'){for(const key of ['name','iso','ram','cpu','disk'])if(f.elements[key])wizard[key]=f.elements[key].value;if(wizardStep<2){wizardStep++;render();}else{toast('Demo machine created · no files written');$('#windowStudy').close();wizardStep=0;}}else if(f.id==='deleteStudy'){toast('Demo removal confirmed · no files deleted');$('#windowStudy').close();}});
$('#windowClose').addEventListener('click',()=>$('#windowStudy').close());$('#confirmCancel').addEventListener('click',()=>$('#confirmStudy').close());$('#windowStudy').addEventListener('close',()=>{if(rollback){rollback();rollback=null;}clearInterval(operationTimer);document.querySelectorAll('#dialogLaunchers button').forEach(b=>b.setAttribute('aria-pressed','false'));});
// Extend the supplied workspace without changing its original state model.
const app=$('#qemu-options .q-app');if(app)app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;if(b.dataset.tab==='Snapshots'||action==='snapshot-start'){e.stopImmediatePropagation();open('snapshots');}else if(action==='add-network'){e.stopImmediatePropagation();open('network');}else if(action==='edit-config'){e.stopImmediatePropagation();open('configuration');}else if(action==='service'){e.stopImmediatePropagation();open('service');}else if(action==='create'){e.stopImmediatePropagation();open(b.textContent.toLowerCase().includes('stand')?'stand':'new-machine');}},true);
// Put the selector above the existing document, not inside the modal layer.
const gallery=$('#dialogGallery');document.body.insertBefore(gallery,document.body.firstChild);
open('snapshots');
})();
</script>
